services:
  # PostgreSQL 16 with PostGIS Spatial Extension
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: antarctic_postgis_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: antarctic_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d antarctic_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antarctic_api_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/antarctic_ai
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models

  # React + Vite Frontend
  frontend:
    image: node:20-alpine
    container_name: antarctic_web_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000

volumes:
  postgres_data:
